name: Release

# Push a tag like v0.2.0 (matching package.json "version") to publish a release with the Windows and Mac
# installers. Running copies see it through the update banner; Docker users update by running the install command again.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Installers are built from a fresh download, never from a cache another workflow run could have written.
          package-manager-cache: false
      - name: Tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Same install policy as CI and the Dockerfile; the packager ships prebuilt binaries.
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm test
      - run: npm run desktop:build
      - name: Collect the installers
        shell: bash
        run: |
          mkdir out
          v="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "Windows" ]; then cp "dist-desktop/Penny Setup $v.exe" out/Penny-Setup-$v.exe; else cp dist-desktop/*.dmg out/; fi
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    # Only the job that creates the release may write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: out
          merge-multiple: true
      # The Windows app installs updates itself only when the installer matches this list.
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The app installs an update only when this list is signed by the release key (desktop/update.cjs).
      # No key, no release: an unsigned list would turn every user's auto-update off.
      - name: Sign the checksums
        env:
          PENNY_UPDATE_SIGNING_KEY: ${{ secrets.PENNY_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$PENNY_UPDATE_SIGNING_KEY" || { echo "::error::Secret PENNY_UPDATE_SIGNING_KEY is not set"; exit 1; }
          node -e "const c=require('crypto'),f=require('fs');f.writeFileSync('out/SHA256SUMS.txt.sig',c.sign(null,f.readFileSync('out/SHA256SUMS.txt'),process.env.PENNY_UPDATE_SIGNING_KEY).toString('base64'))"
      # What is inside this version, for anyone who wants to check it against an advisory later.
      # Generated after the checksums so the signed list still names the installers only.
      - name: Software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          skip-dirs: out
          format: cyclonedx
          output: out/Penny-${{ github.ref_name }}.sbom.cdx.json
      # Nothing between the signature and the upload may change an installer.
      - name: Check the installers against the signed list
        run: cd out && sha256sum -c SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Penny $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
