name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Same policy as the Dockerfile: no dependency install scripts in CI.
      # better-sqlite3 ships prebuilt binaries; Chromium is installed explicitly elsewhere.
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npx next typegen   # route types (PageProps) are generated, not committed
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:anonymity
        env:
          PENNY_ANON_TERM_HASHES: ${{ secrets.PENNY_ANON_TERM_HASHES }}
      - run: npm run format:check
      # Dead files, exports and dependencies; fails the build.
      - run: npm run knip
      # Same suites plus the coverage floor; CI fails if logic or server coverage drops.
      - run: npm run test:coverage
      # Nightly-style drills on every change: a restorable snapshot and indexed report queries.
      - run: npm run restore:drill
      - run: npm run bench:backend -- --rows 20000 --runs 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The product is used on Windows: paths, file locks and line endings must not wait for a release to be tested.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Same install as the release job on Windows; better-sqlite3 carries its win32 prebuild in the package.
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npx next typegen
      - run: npm test

  # A new critical advisory should never reach main unnoticed. High and moderate findings are
  # triaged in SECURITY.md; criticals are not negotiable.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run security:audit:gate

  # Vulnerable dependencies, committed secrets and Dockerfile misconfiguration. Fails on HIGH and
  # CRITICAL; the triaged exceptions are listed in .trivyignore.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  # The image a Docker user runs: OS packages (Chromium, Node base) plus the production node_modules.
  # The build runs the whole test suite, so it stays off pull requests and runs on main only.
  trivy-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t penny:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: penny:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          # Debian carries HIGH findings with no fix for months; only what can be fixed fails the build.
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # Workflow linter: unpinned actions, excessive permissions, leaked credentials, template injection.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          inputs: .github/workflows
          # Plain log output and a failing exit code; no upload to the Security tab.
          advanced-security: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npx next typegen
      # A broken build used to merge: the release job was the first place it ran.
      - run: npx next build
        env:
          PENNY_DATA_DIR: .build-data
          PENNY_UPDATE_CHECK: "0"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and serves a production app on isolated e2e/.data.
      - run: npm run e2e
        env:
          CI: "1"
          PENNY_UPDATE_CHECK: "0"
