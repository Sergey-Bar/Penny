name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same policy as the Dockerfile: no dependency install scripts in CI.
      # better-sqlite3 ships prebuilt binaries; Chromium is installed explicitly elsewhere.
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npx next typegen   # route types (PageProps) are generated, not committed
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      # Same suites plus the coverage floor; CI fails if logic or server coverage drops.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  # A new critical advisory should never reach main unnoticed. High and moderate findings are
  # triaged in SECURITY.md; criticals are not negotiable.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run security:audit:gate

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npx next typegen
      # A broken build used to merge: the release job was the first place it ran.
      - run: npx next build
        env:
          PENNY_DATA_DIR: .build-data
          PENNY_UPDATE_CHECK: "0"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and serves a production app on isolated e2e/.data.
      - run: npm run e2e
        env:
          CI: "1"
          PENNY_UPDATE_CHECK: "0"
