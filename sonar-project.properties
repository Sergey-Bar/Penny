sonar.projectKey=penny
sonar.projectName=Penny
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts
sonar.tests=tests,e2e

# Build output, user data and the marketing site are not part of the product code.
sonar.exclusions=node_modules/**,.next/**,dist-desktop/**,data/**,demo-data/**,test-results/**,\
  e2e/.data/**,website/**,public/**,.build-data/**

# Test fixtures repeat by design; duplicated blocks there are not a finding.
sonar.cpd.exclusions=tests/**

sonar.javascript.node.maxspace=4096

# Coverage comes from `npm run test:coverage` (lcov). The gate covers the layers the
# Vitest suite owns - logic and server modules. React components and pages are covered by
# e2e/ instead, so they are excluded here rather than counted as 0%.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/components/**,src/app/**,src/i18n/**,src/desktop/**

# Reviewed findings: these patterns are deliberate in this codebase.
#
# S8786 (super-linear regex) has no linear equivalent to offer here: every hit is an
# anchored, single-quantifier pattern (\s*$ , ^-+|-+$ , <[^>]+> , [\s\S]* , @.*$).
# S7767 (| 0) fires on int32 wrap in seeded hashes, where Math.trunc would change output.
# S8767 is SonarCSS not parsing Tailwind v4 @utility blocks with nested @supports/@media.
# S6389 flags the regex that STRIPS bidi control characters from merchant names.
# S6853/S6845 fire on primitives that get their label/role from the caller, and on an i18n
# task list whose label text is rendered from translation keys next to a correctly
# associated checkbox.
# One entry per file: this scanner version does not split comma-separated resource keys.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21
