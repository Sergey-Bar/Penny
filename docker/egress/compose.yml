# Optional egress allowlist. The app container gets no internet route of its own; it reaches only
# the hosts in docker/egress/allowlist.txt, through a small proxy container. Off by default.
#   docker compose -f docker-compose.yml -f docker/egress/compose.yml up -d --build
# See docs/security.md ("Docker egress allowlist") for adding a domain.
# Paths below are relative to the folder of the first -f file (the repository root), as compose resolves them.
services:
  penny:
    # The app sits on an internal-only network: no route out, and no published port
    # (the egress container publishes it instead).
    networks: [internal]
    ports: !reset []
    environment:
      HTTP_PROXY: http://egress:8888
      HTTPS_PROXY: http://egress:8888
      http_proxy: http://egress:8888
      https_proxy: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      # Node's own fetch and http(s) follow the proxy variables only with this set.
      NODE_USE_ENV_PROXY: "1"
    depends_on: [egress]

  egress:
    build: docker/egress
    image: penny-egress:latest
    restart: unless-stopped
    networks: [internal, outside]
    ports:
      - "127.0.0.1:41234:41234"
    environment:
      PENNY_EGRESS_EXTRA: ${PENNY_EGRESS_EXTRA:-}
    volumes:
      - ./docker/egress/allowlist.txt:/etc/egress/allowlist.txt:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true
  outside: {}
